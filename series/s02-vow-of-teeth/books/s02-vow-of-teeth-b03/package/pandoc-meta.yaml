description: "Sixty ships. One pass. And a queen who keeps thirty knives in a chest.\n\nNeela was sold to a warden to kill him. Now she is his wife, a leopard by night, and the first name on a company of free assassins. Her husband Devan has given up his fort, his office and the old habit of holding power alone. But the queen's hidden night-guard are still caged by paper, and Neela is the only one who knows how to cut the leash.\n\nThe cure costs. Every guard who frees herself must bind to one chosen person, and every pair will feel each other's wounds for life. Neela and Devan already know that price. Every blow he takes opens on her skin, and every fight he chooses is chosen for her body too.\n\nDevan is the man who could be her cage, and has spent three books refusing to be. Now the Thurai fleet has landed to stay. The queen offers Neela a bargain: command of a page-free night-guard, safe, unseen and hers, with Devan's fort handed back. The pass will not hold without the knives. The knives will not stay free if they have to bleed for each other in a war.\n\nCan Neela free every odiyan, even the queen's guard, if it leaves Varanad without its night-guard as the raiders land?\n\nCrown of Night is the finale of The Odiyan Contracts: a married-couple romantasy with a secret mission, a shared-wound magical bond and a morally grey queen. Open-door, moderate heat. Dark edges, a hard-won happy ever after. Best read after Vow of Teeth and Oath of Claws."
