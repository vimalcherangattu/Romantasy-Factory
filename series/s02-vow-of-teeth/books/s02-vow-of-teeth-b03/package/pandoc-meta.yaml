description: "Every knife she frees will bleed the one it loves.\n\nNeela was a guild assassin who turns into a leopard at night. Now she has one goal left: free every odiyan in Varanad, including the thirty hidden knives of the queen's own night-guard. The queen has offered her a quiet alternative. Take command of a guard with no pages and no cages. Safe, unseen, and hers.\n\nDevan gave up his fort for Neela. He is also the one man who could cage her with a single spoken word, and since the night they bound themselves, every cut he takes opens on her skin. He holds a mountain pass without office, rank or a garrison he can command. She is learning to trust a husband who finally asks before he acts.\n\nSixty Thurai sails have anchored off the coast, and they have come to stay. The only way to give the queen's guard true freedom is to bind each one to a chosen person for life, which makes every freed knife a wound waiting to happen. Freedom may leave the realm with no night-guard just as the raiders climb the pass.\n\nCrown of Night is the closing book of The Odiyan Contracts. It follows an arranged marriage that became a true one, with a protective, morally grey hero, found family, war and a slow-earned happy ever after. Open-door romance, moderate heat.\n\nCan they free every odiyan, even the queen's guard, if it leaves Varanad defenceless when the raiders land?"
