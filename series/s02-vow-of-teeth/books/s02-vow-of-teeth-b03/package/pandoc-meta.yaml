description: "Sixty ships have landed, the queen's secret knives are caged by paper, and the only way to free them is to make each one bleed for someone they love.\n\nNeela was a guild assassin who becomes a leopard after dark. Now she leads a free company of odiyans, with her husband at her back. She wants one thing: every odiyan in Varanad free, even the thirty who guard the queen's bed. But the queen was in the room at each of their first turnings, and she is a living witness who can always write a new page. Full freedom means each guard must speak her night-shape to one chosen person, and that bond is a wound-share for life.\n\nDevan has no office and no fort. He gave them up for her. He is the one man whose silence keeps her uncageable, and his wounds are hers, welt for welt. He means to hold the Monkey Pass against an army that has come to stay, and every fight he chooses is chosen for her body too.\n\nThen Queen Nirmala makes Neela an offer: command of a night-guard with no pages, no pain and no cost. Safe, unseen, and hers.\n\nThe Thurai are climbing the only road into the hills. If the odiyans go free, Varanad loses its hidden knives on the eve of invasion. If they don't, Neela becomes the very thing she escaped.\n\nCan they free every odiyan, even the queen's guard, if it leaves Varanad without its night-guard as the raiders land?\n\nCrown of Night is the finale of The Odiyan Contracts, a dark romantasy with a married couple, a magical wound-share bond, a protective love interest who learns to ask before he acts, and found family. Open-door romance with moderate heat. Best read after Vow of Teeth and Oath of Claws."
