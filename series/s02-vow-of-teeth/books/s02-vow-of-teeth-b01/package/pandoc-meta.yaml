description: "She was sent to kill her husband. He watched her change on their wedding night, and he has not said a word.\n\nNeela is Seventeen of the Resin House, a guild assassin who becomes a leopard by night. One more kill earns her release: her page burned, her birth name returned. The target is Devan, warden of the hill fort Kettamala, and she has forty days before the monsoon closes the pass.\n\nDevan never lies to her. When he can't tell the truth, he says so. He is also the one man alive who has seen her turn, and one word from him, spoken while she wears her night-shape, would cage her as an animal for life. He distrusts the bride the council chose. He has reason: his sister died under contract, and someone on the queen's council is selling the passes to raiders.\n\nThe guild wants him dead before the rains. Master Chathu keeps the ledger that holds her life, and he does not forgive a failed contract. Every night Neela spends under Devan's roof, she must choose between the resin that makes her useful and a night spent human beside the man she is paid to kill.\n\nArranged marriage. Enemies to lovers. A slow burn with a lethal secret, dark edges and open-door heat.\n\nWill Neela kill the husband she was sold to, or hand him the key to her cage?"
