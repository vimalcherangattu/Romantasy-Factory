description: "She was paid to kill her husband. He watched her change on their wedding night.\n\nNeela is an odiyan, a guild assassin who becomes a leopard after dark. Sold as a bride to Devan, warden of the hill fort Kettamala, she has forty days before the monsoon seals the Monkey Pass to finish her twelfth contract. Twelve kills buy release: her guild page burned and her birth name returned. She has never known that name.\n\nDevan is quiet, exact and does not lie. He is also the one man alive who saw her turn. In this world, anyone who watches an odiyan change can cage her for life with a single spoken word. He could say it any night. Instead he bars the shutters, kennels the hounds and asks her for nothing. She can't tell whether that is mercy or a hunter's patience.\n\nThe guild wants him dead by the new moon, and its enforcer is not a patient man. Someone on the queen's council is selling the passes to raiders. Devan's sister died on his own stairs six years ago. And every night Neela spends beside him puts her cage one careless word closer to his mouth.\n\nWill Neela kill the husband she was sold to, or trust the one man who holds her leash to cut it?\n\nArranged marriage. Enemies to lovers. Slow burn. Open-door heat and dark edges. Book 1 of The Odiyan Contracts, with a happy-for-now ending and a series question that pulls into book 2."
