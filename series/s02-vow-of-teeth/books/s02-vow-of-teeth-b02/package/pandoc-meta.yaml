description: "Steal the ledger that owns every odiyan, or die as the guild's property.\n\nNeela is a leopard-shifting assassin with two smears of resin left, a crown price on her head and a husband she was once paid to kill. Devan, the warden she was sold to, has stood between her and every blade since the wedding night. Now the monsoon has sealed the passes, the guild is hunting her, and a crown justice is at his gate with a warrant.\n\nTogether they plan to rob the Resin House. Devan needs one contract as proof of his sister's murder. Neela wants every page back in the hand it names. Both plans go through the same door.\n\nThe man who could cage her with one spoken word has sworn never to say it. Their wounds are shared, their bargain is written in the dark, and the first contract Neela reads aloud will name the part she played in his sister's death.\n\nThe ledger can free forty lives or make her the master Chathu was. Can they steal it without becoming its new masters?\n\nOath of Claws is book 2 of The Odiyan Contracts, a dark romantasy with an arranged marriage turned real, a heist in the monsoon rains and shared wounds that make every fight a risk for both. Start with Vow of Teeth for the full story."
