description: "Every page in the ledger is a life. The first one she reads aloud names her at his sister's murder.\n\nNeela is a leopard by night, a rogue by law and, since the rains closed the Monkey Pass, a wife by choice. Her resin is down to its last two smears and the guild is hunting her. She has one plan: steal the black ledger that owns every odiyan and put each page back in the hand it names.\n\nDevan, warden of Kettamala, wants a single page: the contract for his sister's death, in plain ink, for a court. He is the one man who could cage Neela with one word, and the husband who swore he never will. But a crown justice now sits in his hall, her silent guards cross a road no one can walk, and the book they steal holds a truth about Neela that neither of them chose.\n\nWith forty frightened odiyans looking to her, Neela must decide whether holding their pages makes her their rescuer or their new master. And Devan must decide what he can still love when the proof is in his hands.\n\nMarriage under strain, a morally grey hero who gives his power away, a monsoon-night heist and a guild that owns its own. Open-door romance with real consequences.\n\nCan they steal the guild's ledger without becoming its new masters?\n\nBook 2 of The Odiyan Contracts. Best read after Vow of Teeth."
