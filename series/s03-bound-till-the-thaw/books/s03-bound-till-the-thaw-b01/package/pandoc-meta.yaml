group-position: 1
description: "One rope. One fire. A mountain that knows when you lie.\n\nMeera has guided smugglers over the closed Shilak Pass for ten winters. Now twelve packets of medicine are all that stand between her brother's fever village and the graveyard. She will cross the Long Saddle in the dead of winter to deliver them, whatever the Closing Law says. The wardens hang people for less.\n\nCaptain Rohan is the queen's warden, and he keeps the law to the letter. He hunts the crew behind her, and he needs a guide over the same pass on a secret errand for the crown. When an avalanche leaves the two of them alone, the mountain spirits bind them wrist to wrist with a red wool rope. Neither can stray more than eight arm-spans from the other until the thaw. Every lie told to a bound partner costs body heat, and silence is the only thing that stays free. Every true word is also evidence, and a shared fire is a hanging crime.\n\nShe can't afford to trust a man sworn to take her crew to the rope. He can't afford to want a woman whose truth could end his oath. Past the snowline, a village is coughing, a regent is closing in, and the one honest thing between them is getting harder to ignore.\n\nTropes: enemies to lovers, forced proximity, magical bond, slow burn. Open-door romance with moderate heat.\n\nWhen the thaw comes and the rope comes off, will he arrest her, or will he choose her?"
