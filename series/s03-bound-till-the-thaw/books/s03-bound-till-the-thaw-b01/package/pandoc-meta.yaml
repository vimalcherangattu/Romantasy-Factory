description: "Cross a closed mountain pass in winter and the law will hang you. Cross it rope-bound to the man sworn to hang you, and every lie will cost you your body heat.\n\nMeera is the best smuggler-guide on the Shilak Pass and the secret head of the crew the wardens call the Salt Fox. Her brother is dying of the grey cough in a cut-off fever village, and twelve packets of medicine are the only thing that can reach him in time. She has ten winters of crossings in her ledger, a crew to keep off the gallows, and no use for the crown's law.\n\nCaptain Rohan of the queen's pass-wardens is exact, controlled and impossible to bribe. He needs a guide over the Long Saddle in twenty days, and his writ orders him to deliver the Salt Fox to the rope at the thaw. When the mountain spirits bind the two of them wrist to wrist, neither can stray beyond eight arm-spans, and neither can lie to the other without paying in frostbite. Every true word becomes both an intimacy and a piece of evidence. One fire, one rope, and a law that calls sharing warmth a hanging crime.\n\nThe medicine must cross. The seal he carries could stop a coup. Someone on that mountain wants them both buried, and the only thing between Meera and the noose is the man holding the other end of her rope.\n\nEnemies to lovers. Forced proximity. A magical bond that makes honesty dangerous. Slow burn with a costly first kiss, two open-door scenes and a happy ending.\n\nBook 1 of The Winter Passes. Every book is a complete love story with its own happy ending.\n\nWill Meera get the medicine through to Ranu, and will Rohan arrest her?"
