description: "She smuggles medicine over a closed pass. He hangs smugglers. The mountain just tied them together.\n\nMeera is twenty-nine, the secret head of the Salt Fox crew, and she has twelve packets of redbark and one purpose: reach the fever village of Ranu before the grey cough takes her brother and the children around him. The only way over the Long Saddle in winter is a guide's knowledge of the mountain and the favour of the jogini, the spirits of the pass.\n\nCaptain Rohan is thirty-five, the queen's most exact pass-warden, and he has hunted her crew for three winters. He needs a guide to carry a secret across the pass in twenty days. He also holds a writ ordering him to deliver the Salt Fox to the rope at the thaw. He has never hurt anyone he did not first measure against the law, and that is what makes him dangerous to her.\n\nAfter an avalanche, the jogini bind them wrist to wrist. They cannot part beyond eight arm-spans. Every lie costs body heat, and a great lie costs flesh. Every true word between them is an intimacy and evidence. Sharing one fire is a hanging crime.\n\nThe medicine must get through. Ranu is counting its graves. And the closer they come to the truth, the closer they come to the noose.\n\nWhen the only thing the mountain lets you say is true, can you love the man who carries the rope?\n\nEnemies to lovers. Forced proximity. A magical bond that makes every word count. Slow burn, with an open-door ending worth the cold. Book 1 of The Winter Passes; each book is a complete romance with a happy ending."
