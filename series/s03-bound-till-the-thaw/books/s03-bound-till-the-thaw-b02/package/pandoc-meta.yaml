description: "Every lie costs body heat. Every true answer becomes a line on the queen's map.\n\nIla, crown pass-surveyor, believes a map is only ever true or false. The queen has ordered her to chart every winter way across the closed passes of Hemkot, and the chief surveyor's chair depends on it. To cross in winter she must be rope-bound to a guide, and the hill council will seal her licence only if one of its own walks the rope with her.\n\nThe one they send is Prince Kunal of Neshar, the man who told her to her face that he would vote against her. He answers every question with a question. He keeps the valley's hidden routes in his head so that no garrison can ever find them. He is also the quiet hand who paid for a fever village's medicine, and he is the most dangerous man Ila could be tied to. On this mountain a lie freezes the liar's fingers, and everything he admits to her can end up inked on a crown sheet.\n\nThe queen's commission names a way beneath the Shilak Cairn that no map has ever shown. Raghu, a loyalist captain, is hunting the same way for the escaped regent. Ila has until the Meadow Cairn thaws, thirty-five days at best, to learn what is owed beneath the mountain and to decide whose map she is drawing.\n\nRivals to lovers. Forced proximity on a frozen mountain. A magical bond where honesty is the only warmth. Open-door heat, a slow-burn romance, and a happy ending for this couple, with a series thread that carries on.\n\nWill Ila draw the hidden passes for the queen, or hide them for Neshar?\n\nThe Winter Oath is Book 2 of The Winter Passes. Each book follows a new couple and completes their love story. Adult romantasy (18+). This book was written with AI assistance."
