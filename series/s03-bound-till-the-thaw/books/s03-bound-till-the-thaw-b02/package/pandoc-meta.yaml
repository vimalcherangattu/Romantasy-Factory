description: "On the mountain, every lie costs body heat. And every true answer he gives her becomes a line on the queen's map.\n\nIla is the crown's pass-surveyor, and she believes a map is only ever true or false. Her queen has ordered her to chart every winter way across the closed passes of Hemkot. Without them she will never be Chief Surveyor. To cross, she must be rope-bound to a guide chosen by the hill council.\n\nThe guide is Prince Kunal of Neshar. He is charming, sharp-edged and sworn to keep his valley's hidden ways off every map. He spoke against her licence, then tied himself to her wrist so he could choose what she sees. He answers every question with a question. On this rope, he can't lie to her for free, and neither can she.\n\nKunal is dangerous to her in the way that matters most. Every secret route he shares can be drawn, and every line she draws could bring garrisons to his people's doors. Then Ila opens a sealed letter at the Glass Lakes. It says her family's grave lies beneath the mountain, and the way to it runs through his.\n\nThe pass will close forever unless the spirits' Old Bargain is paid. A rebel force is hunting the princes' way. And the man she is falling for may be the heir to the secret that cost her grandfather his life.\n\nWill Ila hand the mountain to the crown, hide it for Neshar, or find the third way, if love can survive the truth?\n\nThe Winter Oath is Book 2 of The Winter Passes, a survival-adventure romantasy series. Each book follows a new couple and ends with a happy ever after for that couple. Tropes: enemies to lovers, forced proximity, magical bond, slow burn."
